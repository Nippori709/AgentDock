name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: npm ci

      - name: Install Python media dependency
        run: python -m pip install --disable-pip-version-check "pymupdf>=1.24,<2"

      - name: Build
        run: npm run build

      - name: Control Center tests
        run: npm run control-center:test

      - name: Control Center smoke
        run: npm run control-center:smoke

      - name: Control Center layout
        if: runner.os == 'Windows'
        run: npm run control-center:layout

      - name: Smoke tests
        run: npm run smoke

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Check package contents
        run: npm pack --dry-run --ignore-scripts

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Quick benchmark
        run: npm run benchmark:quick
